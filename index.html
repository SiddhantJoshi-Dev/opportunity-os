<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Opportunity OS</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      background: white;
      padding: 70px 8%;
      text-align: center;
    }

    .hero h2 {
      font-size: 46px;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #6b7280;
      font-size: 18px;
      line-height: 1.6;
    }

    .search-area {
      padding: 40px 8%;
      text-align: center;
    }

    #searchBox {
      width: 100%;
      max-width: 700px;
      padding: 18px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    .opportunities {
      padding: 20px 8% 60px;
    }

    .opportunities h2 {
      margin-bottom: 25px;
    }

    #opportunityList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .opportunity-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .opportunity-card h3 {
      margin-bottom: 12px;
    }

    .opportunity-card p {
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .tags span {
      background: #eef2ff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #111827;
      color: white;
    }

  </style>
</head>

<body>

  <header>

    <h1>Opportunity OS</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#opportunities">Discover</a>
    </nav>

  </header>


  <section class="hero">

    <h2>Find Your Next Opportunity.</h2>

    <p>
      Discover hackathons, competitions, scholarships,
      tech programs, events, and volunteering opportunities
      designed to help students learn, compete and grow.
    </p>

  </section>


  <section class="search-area">

    <input
      type="text"
      id="searchBox"
      placeholder="🔎 Search hackathons, scholarships, competitions..."
      oninput="searchOpportunities()"
    >

  </section>


  <section class="opportunities" id="opportunities">

    <h2>🔥 Discover Opportunities</h2>

    <div id="opportunityList"></div>

  </section>


  <footer>

    <p>
      Built by Siddhant Joshi • Opportunity OS
    </p>

  </footer>


  <script src="script.js"></script>

</body>

</html>
